<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRI SuperApp — Mockup dari kode asli</title><style>*{box-sizing:border-box}body{margin:0;background:#242529;color:#ededee;font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{min-height:56px;display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid #3c3e43;flex-wrap:wrap}h1{font-size:13px;margin:0;font-weight:600}small{display:block;color:#b0b1b7;margin-top:4px;font-size:10px}label{display:flex;align-items:center;gap:7px;color:#c3c4c9;font-size:11px}select,button{font:inherit;background:#36383e;border:1px solid #505259;color:white;border-radius:7px;padding:7px 9px;cursor:pointer}.devices{display:flex;gap:5px;margin-left:auto}.devices button.active{background:#ececee;color:#222}main{display:flex;justify-content:center;padding:0;height:calc(100dvh - 57px);overflow:auto}iframe{display:block;width:100%;height:100%;border:0;background:white;transition:width .25s}body.device main{padding:18px 0}body.device iframe{border-radius:20px;box-shadow:0 12px 50px #0005;border:5px solid #111;max-width:100%}.hint{color:#8ad4a5;font-size:10px;white-space:nowrap}@media(max-width:720px){header{gap:9px;padding:10px}h1{font-size:12px}main{height:calc(100dvh - 108px)}.devices{margin-left:0}.hint{display:none}label{font-size:10px}select,button{font-size:10px}}</style></head><body><header><div><h1>PRI SuperApp · Dashboard Faris</h1><small>Eksperimen pengguna · Komponen aplikasi · Data contoh</small></div><label for="screen">Layar <select id="screen"><option value="beranda" selected>Faris · Desain baru</option><option value="lama">Pengguna · Desain lama</option><option value="master">Referensi dashboard master</option><option value="tvrku">TVR Saya</option><option value="tv">TV Rakyat Official</option></select></label><label for="theme">Tema <select id="theme"><option value="pagi">Pagi</option><option value="sore">Sore</option><option value="malam">Malam</option><option value="classic">Classic</option></select></label><span class="hint">● Tanpa koneksi produksi</span><div class="devices"><button data-width="100%" class="active">Desktop</button><button data-width="820px">Tablet</button><button data-width="390px">HP</button></div></header><main><iframe id="preview" src="./app.html" title="Pratinjau PRI SuperApp dari komponen asli" sandbox="allow-scripts allow-same-origin allow-downloads"></iframe></main><script>const frame=document.getElementById('preview');function send(type,value){frame.contentWindow.postMessage({type,value},location.origin)}document.getElementById('screen').onchange=e=>send('screen',e.target.value);document.getElementById('theme').onchange=e=>send('theme',e.target.value);document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width;document.body.classList.toggle('device',b.dataset.width!=='100%');document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('active',x===b))});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data.type==='screen-changed')document.getElementById('screen').value=e.data.value;if(e.data.type==='preview-ready'){send('screen',document.getElementById('screen').value);send('theme',document.getElementById('theme').value)}});</script></body></html>
