# =====================================================================
# SUSUNAN CONTAINER PRI SUPERAPP DI VPS (11 Sep 2026)
#
# Satu tumpukan terpisah bernama "pri", berdampingan dengan tumpukan
# Supabase dan dengan aplikasi lain yang sudah lebih dulu ada di server
# ini. Tidak ada satu pun yang saling menimpa.
#
#   aplikasi  — Next.js (hasil build standalone)
#   redis     — cache bersama: sesi, tanda detak, siapa yang online
#   jadwal    — penjalan tugas berkala, pengganti Vercel Cron
#   autoedit-* — mesin Auto Edit video (modul khusus master, 30 Sep 2026):
#               API + worker render ffmpeg + Redis antreannya sendiri
#
# Gerbang masuk tetap Caddy milik server (di luar tumpukan ini), yang
# membagi berdasarkan nama domain. Karena itu TIDAK ADA satu pun port di
# sini yang terbuka ke internet — semuanya hanya mendengar di dalam
# server (127.0.0.1), persis seperti tumpukan Supabase.
# =====================================================================
name: pri

services:
  aplikasi:
    build:
      # Relatif ke berkas ini (folder aplikasi/). Tetap benar di
      # /opt/pri lama maupun /opt/pri-superapp.
      context: ../sumber
      dockerfile: ../aplikasi/Dockerfile
      args:
        # Dibutuhkan saat build: daftar host gambar next/image.
        SUPABASE_URL: ${SUPABASE_URL}
    image: pri-aplikasi:terbaru
    container_name: pri-aplikasi
    restart: unless-stopped
    env_file:
      - ./env.txt
    environment:
      # Cache bersama ada di dalam server, bukan menyeberang internet.
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      TZ: Asia/Jakarta
    # Permintaan aplikasi ke Supabase memakai alamat PUBLIK (sama dengan
    # yang dipakai peramban). Ini disengaja: sepuluh tempat di kode
    # menyimpan alamat berkas hasil `getPublicUrl` ke database — kalau
    # klien server memakai alamat dalam, yang tersimpan jadi alamat yang
    # tidak bisa dibuka siapa pun. Baris di bawah membuat nama itu
    # menunjuk balik ke server ini, jadi permintaannya tidak keluar ke
    # internet, cuma mampir ke Caddy di mesin yang sama.
    extra_hosts:
      - "${DOMAIN_DB}:host-gateway"
    # Socket API Auto Edit: satu-satunya jalan ke layanan itu (tanpa port,
    # tanpa jaringan bersama). Disiapkan 12-perbarui.sh (siapkan-disk.sh).
    volumes:
      - /srv/godam/sock:/run/autoedit
    ports:
      - "127.0.0.1:${PORT_APLIKASI:-3001}:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pri
    # Batas memori: 32 GB dibagi bersama Supabase (PostgreSQL sendiri
    # sudah memesan 7 GB) dan aplikasi lain di server ini.
    deploy:
      resources:
        limits:
          memory: 4G
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:7-alpine
    container_name: pri-redis
    restart: unless-stopped
    # allkeys-lru: kalau memori penuh, yang paling lama tidak dipakai
    # dibuang sendiri. Ini CACHE — kehilangan isinya tidak merusak data,
    # cuma membuat permintaan berikutnya sedikit lebih lambat.
    command:
      - redis-server
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pri
    deploy:
      resources:
        limits:
          memory: 2560M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  jadwal:
    build:
      context: ./jadwal
    image: pri-jadwal:terbaru
    container_name: pri-jadwal
    restart: unless-stopped
    environment:
      # Dipanggil lewat jaringan dalam, tidak lewat internet.
      APP_URL: http://aplikasi:3000
      CRON_SECRET: ${CRON_SECRET}
      TZ: Asia/Jakarta
    depends_on:
      - aplikasi
    networks:
      - pri
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Auto Edit ---------------------------------------------------
  # Terpisah total dari aplikasi: jaringannya sendiri (subnet tetap supaya
  # firewall keluar di vps/autoedit/firewall-keluar.sh bisa menutup akses
  # ke alamat privat — pengunduh video menerima link dari luar), Redis
  # sendiri, disk media sendiri (/srv/godam/media, image 60 GB: penuh pun
  # disk database tidak tersentuh), dan batas CPU/RAM supaya render tidak
  # merebut jatah database. Rahasianya hanya kunci DeepSeek & sesi Instagram
  # (autoedit.env, disaring 12-perbarui.sh dari env.txt) — bukan seluruh env.
  autoedit-redis:
    image: redis:7-alpine
    container_name: pri-autoedit-redis
    restart: unless-stopped
    # Antrean render: AOF menyala dan TIDAK ada pembuangan kunci.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - autoedit-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [autoedit]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  autoedit-api:
    build:
      context: ../sumber/autoedit
    image: pri-autoedit:terbaru
    container_name: pri-autoedit-api
    restart: unless-stopped
    init: true
    env_file:
      - path: ./autoedit.env
        required: false
    environment:
      ROLE: api
      REDIS_URL: redis://autoedit-redis:6379/0
      MEDIA_DIR: /data/media
      TZ: Asia/Jakarta
    volumes:
      - /srv/godam/media:/data/media
      - /srv/godam/sock:/run/autoedit
    depends_on:
      autoedit-redis:
        condition: service_healthy
    networks: [autoedit]
    healthcheck:
      test: ["CMD", "python", "sehat.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Outro dirender di proses API (utas + ffmpeg), jadi jatahnya lebih
    # dari sekadar API.
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M, pids: 256 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # SATU video sekaligus, 2 utas encoder. Naikkan CELERY_CONCURRENCY hanya
  # bersama batas CPU di bawah.
  autoedit-worker:
    image: pri-autoedit:terbaru
    container_name: pri-autoedit-worker
    restart: unless-stopped
    init: true
    env_file:
      - path: ./autoedit.env
        required: false
    environment:
      ROLE: worker
      REDIS_URL: redis://autoedit-redis:6379/0
      MEDIA_DIR: /data/media
      CELERY_CONCURRENCY: "1"
      VIDEO_THREADS: "2"
      TZ: Asia/Jakarta
    volumes:
      - /srv/godam/media:/data/media
    depends_on:
      autoedit-redis:
        condition: service_healthy
    networks: [autoedit]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G, pids: 512 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Auto Edit versi TypeScript (2 Okt 2026) ----------------------
  # Pengganti dua container Python di atas: kode di src/mesin-video/ repo
  # ini, image vps/autoedit-ts/Dockerfile. Socket, disk media, Redis, dan
  # jaringannya SAMA, jadi hanya satu pasang yang boleh menyala — dipilih
  # berkas $APP/autoedit-mesin ("python" | "ts") oleh 12-perbarui.sh.
  autoedit-ts-api:
    profiles: ["ts"]
    build:
      context: ../sumber
      dockerfile: vps/autoedit-ts/Dockerfile
    image: pri-autoedit-ts:terbaru
    container_name: pri-autoedit-ts-api
    restart: unless-stopped
    init: true
    command: ["node", "--enable-source-maps", "utama.mjs"]
    env_file:
      - path: ./autoedit.env
        required: false
    environment:
      AUTOEDIT_PERAN: api
      REDIS_URL: redis://autoedit-redis:6379/0
      MEDIA_DIR: /data/media
      TZ: Asia/Jakarta
    volumes:
      - /srv/godam/media:/data/media
      - /srv/godam/sock:/run/autoedit
    depends_on:
      autoedit-redis:
        condition: service_healthy
    networks: [autoedit]
    healthcheck:
      test: ["CMD", "node", "sehat.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Outro dirender di proses API (ffmpeg), jadi jatahnya lebih dari API.
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M, pids: 256 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # SATU video sekaligus, 2 utas encoder — sama dengan worker Python.
  autoedit-ts-worker:
    profiles: ["ts"]
    image: pri-autoedit-ts:terbaru
    container_name: pri-autoedit-ts-worker
    restart: unless-stopped
    init: true
    command: ["node", "--enable-source-maps", "pekerja.mjs"]
    env_file:
      - path: ./autoedit.env
        required: false
    environment:
      AUTOEDIT_PERAN: worker
      REDIS_URL: redis://autoedit-redis:6379/0
      MEDIA_DIR: /data/media
      VIDEO_WORKER_PARALEL: "1"
      VIDEO_THREADS: "2"
      TZ: Asia/Jakarta
    volumes:
      - /srv/godam/media:/data/media
    depends_on:
      autoedit-redis:
        condition: service_healthy
    networks: [autoedit]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G, pids: 512 }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- Auto Edit di VPS MESIN (5 Okt 2026) ---------------------------
  # Mode "jauh" ($APP/autoedit-mesin = jauh): mesin Auto Edit berjalan di
  # VPS kedua (vps/mesin/). Jembatan ini memegang socket yang dipasang
  # aplikasi (/srv/godam/sock/api.sock) dan meneruskan tiap koneksi lewat
  # jalur privat WireGuard ke 10.77.0.2:7700 — aplikasi tidak tahu bedanya.
  # Saat mode ini aktif, autoedit-* di atas tidak dinyalakan (12-perbarui.sh).
  autoedit-jembatan:
    profiles: ["jauh"]
    image: alpine/socat:latest
    container_name: pri-autoedit-jembatan
    restart: unless-stopped
    network_mode: host
    command:
      - "UNIX-LISTEN:/run/autoedit/api.sock,fork,mode=666,unlink-early,backlog=128"
      - "TCP:10.77.0.2:7700,connect-timeout=5"
    volumes:
      - /srv/godam/sock:/run/autoedit
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  redis-data:
  autoedit-redis-data:

networks:
  pri:
    name: pri
  autoedit:
    name: pri-autoedit
    ipam:
      config:
        - subnet: 10.251.0.0/24
