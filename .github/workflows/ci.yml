# Periksa kode di GitHub sebelum digabung.
# Tidak men-deploy apa pun — itu tugas deploy-vps.yml.
name: Periksa

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tipe:
    name: Pemeriksa tipe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
