<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" font-family="Arial, Helvetica, sans-serif">
  <!-- Contoh video jadi Edit Otomatis TVR Saya (tutorial, 5 Okt 2026) -->
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="0.55" stop-color="#BAE6FD"/>
      <stop offset="0.56" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FEE2E2"/>
    </linearGradient>
  </defs>

  <!-- VIDEO ANDA (latar) -->
  <rect width="720" height="1280" fill="url(#langit)"/>
  <circle cx="560" cy="300" r="70" fill="#FDE68A"/>
  <path d="M0 720 Q180 600 360 700 T720 680 L720 1280 L0 1280 Z" fill="#22C55E" opacity="0.7"/>
  <path d="M300 1280 L380 720 L420 720 L520 1280 Z" fill="#78716C"/>
  <path d="M398 760 L398 800 M396 860 L394 920 M392 990 L388 1080" stroke="#FAFAF9" stroke-width="8"/>
  <g fill="#1F2937">
    <circle cx="200" cy="640" r="22"/><rect x="180" y="664" width="40" height="80" rx="16"/>
    <circle cx="270" cy="660" r="20"/><rect x="252" y="682" width="36" height="74" rx="14"/>
    <circle cx="520" cy="650" r="22"/><rect x="500" y="674" width="40" height="80" rx="16"/>
  </g>
  <text x="360" y="520" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF" opacity="0.85">VIDEO ANDA</text>

  <!-- (3) BOOM LIKE SHARE -->
  <g transform="translate(600,560)">
    <circle r="54" fill="#DC2626"/>
    <path d="M-22 6 h12 v28 h-12 Z M-6 34 v-30 l14-24 c6-8 16-2 13 7 l-5 13 h17 c8 0 12 6 10 13 l-7 22 c-2 6-6 9-12 9 Z" fill="#FFFFFF"/>
    <circle cy="128" r="54" fill="#FFFFFF"/>
    <path d="M-20 140 v-16 c0-16 14-28 32-28 h4 v-16 l26 28 l-26 28 v-16 h-6 c-14 0-24 6-30 20 Z" fill="#DC2626" transform="translate(-6,-4)"/>
    <text y="214" text-anchor="middle" font-size="26" font-weight="900" fill="#FFFFFF" stroke="#7F1D1D" stroke-width="5" paint-order="stroke">LIKE &amp; SHARE</text>
  </g>

  <!-- (2) KOTAK MONAS: panel tulisan berita -->
  <g>
    <rect x="30" y="868" width="660" height="290" rx="26" fill="url(#panel)" stroke="#DC2626" stroke-width="6"/>
    <rect x="30" y="868" width="20" height="290" rx="10" fill="#DC2626"/>
    <g transform="translate(612,1150)" fill="#B91C1C" opacity="0.16">
      <rect x="-70" y="-24" width="140" height="24"/>
      <polygon points="-45,-24 45,-24 30,-56 -30,-56"/>
      <polygon points="-14,-56 14,-56 8,-250 -8,-250"/>
      <rect x="-16" y="-262" width="32" height="12"/>
    </g>
    <path d="M612 838 C626 853 626 868 612 876 C598 868 598 853 612 838 Z" fill="#F59E0B" opacity="0.6"/>
    <!-- tulisan berita: kata pertama MERAH -->
    <text x="76" y="958" font-size="46" font-weight="900" fill="#111827"><tspan fill="#DC2626">VIRAL!</tspan> Warga Gotong</text>
    <text x="76" y="1014" font-size="46" font-weight="900" fill="#111827">Royong Perbaiki Jalan</text>
    <text x="76" y="1070" font-size="46" font-weight="900" fill="#111827">Desa yang Rusak</text>
    <text x="76" y="1124" font-size="26" font-weight="700" fill="#6B7280">SUMBER: @akun_sumber</text>
  </g>

  <!-- BADGE KATEGORI (teks diisi per video) -->
  <rect x="58" y="808" width="176" height="62" rx="14" fill="#DC2626"/>
  <text x="146" y="852" text-anchor="middle" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="3">NEWS</text>

  <!-- (1) BINGKAI TERATAS: logo atas, garis tepi, pita bawah -->
  <rect x="0" y="0" width="720" height="128" fill="#DC2626"/>
  <rect x="0" y="122" width="720" height="8" fill="#F59E0B"/>
  <rect x="34" y="26" width="76" height="76" rx="18" fill="#FFFFFF"/>
  <text x="72" y="78" text-anchor="middle" font-size="40" font-weight="900" fill="#DC2626">TV</text>
  <text x="128" y="66" font-size="40" font-weight="900" fill="#FFFFFF" letter-spacing="2">TV RAKYAT</text>
  <text x="130" y="100" font-size="22" font-weight="700" fill="#FEE2E2">Partai Rakyat Indonesia</text>
  <rect x="0" y="0" width="720" height="1280" fill="none" stroke="#DC2626" stroke-width="14"/>
  <rect x="0" y="1214" width="720" height="66" fill="#DC2626"/>
  <text x="360" y="1257" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">@tvrakyat_anda</text>

  <!-- Penanda nomor bahan (sama dengan gambar bahan) -->
  <g font-size="30" font-weight="900" text-anchor="middle">
    <circle cx="680" cy="170" r="26" fill="#F59E0B"/><text x="680" y="181" fill="#111827">1</text>
    <circle cx="680" cy="900" r="26" fill="#F59E0B"/><text x="680" y="911" fill="#111827">2</text>
    <circle cx="520" cy="480" r="26" fill="#F59E0B"/><text x="520" y="491" fill="#111827">3</text>
  </g>
</svg>
